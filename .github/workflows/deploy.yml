name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.2

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          script: |
            set -euo pipefail

            cd ~/Desktop/agroeye-server

            echo "==> Pulling latest code..."
              git fetch origin
              git reset --hard origin/main

            echo "==> Ensuring external networks exist..."
            docker network create edge_net 2>/dev/null || true
            docker network create infra_net 2>/dev/null || true

            echo "==> Building and deploying..."
            docker compose up -d --build --remove-orphans

            echo "==> Waiting for services to stabilize..."
            sleep 15

            echo "==> Checking service health..."
            docker compose ps --format json | python3 -c "
            import sys, json
            services = [json.loads(line) for line in sys.stdin if line.strip()]
            failed = [s['Name'] for s in services if 'unhealthy' in s.get('Status', '').lower() or 'exit' in s.get('State', '').lower()]
            if failed:
                print(f'FAILED services: {failed}')
                sys.exit(1)
            print(f'All {len(services)} services running.')
            "

            echo "==> Deployment complete!"
