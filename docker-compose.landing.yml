services:
  landing:
    build:
      context: ./landing
      dockerfile: Dockerfile
    image: agroeye-landing:latest
    restart: always

    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    ports:
      - "${LANDING_PORT:-8081}:80"

    networks:
      - landing_net

networks:
  landing_net:
    driver: bridge
